name: Debug GitCode API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    env:
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect full diff object
        run: |
          pip install gitcode-cli==0.13.0 >/dev/null
          python - <<'PY'
          import json, os, subprocess
          env = {**os.environ, "GC_TOKEN": os.environ["GITCODE_TOKEN"], "CI": "true", "GC_NO_UPDATE_CHECK": "1"}
          r = subprocess.run(["gitcode", "api", "repos/cann/npu-simulator/pulls/70/files.json"], capture_output=True, text=True, env=env)
          data = json.loads(r.stdout)
          diffs = data.get("diffs") or []
          print("diffs", len(diffs))
          for idx, d in enumerate(diffs):
              trimmed = {k: v for k, v in d.items() if k != "content"}
              text = (d.get("content") or {}).get("text") or []
              trimmed["content_text_sample"] = [
                  {k: line.get(k) for k in ("type", "old_line", "new_line")} | {"line": str(line.get("line_content"))[:50]}
                  for line in text[:3]
              ]
              print(f"--- diff {idx} ---")
              print(json.dumps(trimmed, ensure_ascii=False, indent=2)[:1600])
          PY
