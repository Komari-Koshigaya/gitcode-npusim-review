name: GitCode PR Review

on:
  schedule:
    # 每天 01:17 UTC = 北京时间 09:17（避开整点）
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只生成报告，不向 GitCode 提交评论"
        type: boolean
        default: false
      force_review:
        description: "忽略去重状态强制重新检视（仍遵守严重度阈值）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: npu-sim-pr-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
      REPORT_TZ_OFFSET_HOURS: "8"
      GITCODE_REPO: cann/npu-simulator
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
      # 支持 DS_API_KEY（DeepSeek）或 LLM_API_KEY（通用）
      LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.DS_API_KEY }}
      LLM_BASE_URL: "${{ vars.LLM_BASE_URL || 'https://api.deepseek.com' }}"
      LLM_MODEL: "${{ vars.LLM_MODEL || 'deepseek-chat' }}"
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GitCode CLI
        run: |
          python -m pip install --upgrade pip
          pip install gitcode-cli==0.13.0
          gitcode version

      - name: Run reviewer
        run: python -m reviewer --repo "$GITCODE_REPO" ${{ inputs.force_review && '--force-review' || '' }}

      - name: Upload dry-run report
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-report
          path: report
          if-no-files-found: ignore

      - name: Commit reports
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report state
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          git commit -m "chore: update PR review report $(TZ=Asia/Shanghai date +%F)"
          git push
